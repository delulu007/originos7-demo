  <!-- Phone 2: expanded -->
  <g filter="url(#shadow)">
    <rect x="480" y="110" width="300" height="570" rx="46" fill="#0a0a0e" stroke="#2a2c38" stroke-width="2"/>
    <rect x="490" y="120" width="280" height="550" rx="38" fill="url(#wall)"/>
    <circle cx="550" cy="170" r="90" fill="#5b8cff" opacity="0.2" filter="url(#glow)"/>

    <!-- status bar -->
    <text x="520" y="150" fill="#dfe3f0" font-family="Helvetica, Arial, sans-serif" font-size="11">09:41</text>
    <rect x="712" y="141" width="18" height="9" rx="2.5" fill="none" stroke="#dfe3f0" stroke-opacity="0.8"/>
    <rect x="714" y="143" width="11" height="5" rx="1.5" fill="#dfe3f0"/>

    <!-- expanded island -->
    <rect x="510" y="160" width="240" height="158" rx="28" fill="url(#island)" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="528" y="178" width="44" height="44" rx="14" fill="url(#art)"/>
    <text x="550" y="205" text-anchor="middle" fill="#fff" font-family="Helvetica, Arial, sans-serif" font-size="18">♫</text>
    <text x="584" y="192" fill="#eef1f8" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Midnight City</text>
    <text x="584" y="208" fill="#ffffff" fill-opacity="0.55" font-family="Helvetica, Arial, sans-serif" font-size="9">M83</text>
    <circle cx="728" cy="188" r="11" fill="#ffffff" fill-opacity="0.08"/>
    <path d="M725 185l6 6M731 185l-6 6" stroke="#fff" stroke-opacity="0.75" stroke-width="1.4" stroke-linecap="round"/>

    <rect x="528" y="236" width="204" height="4" rx="2" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="528" y="236" width="76" height="4" rx="2" fill="#5b8cff"/>
    <text x="528" y="252" fill="#ffffff" fill-opacity="0.45" font-family="Helvetica, Arial, sans-serif" font-size="7.5">0:51</text>
    <text x="732" y="252" text-anchor="end" fill="#ffffff" fill-opacity="0.45" font-family="Helvetica, Arial, sans-serif" font-size="7.5">3:38</text>

    <!-- controls -->
    <g fill="#ffffff">
      <path d="M594 278h-9l-7 6v-12l7 6h9z"/>
      <rect x="595" y="272" width="2" height="12" rx="1"/>
      <path d="M621 278h9l7-6v12l-7-6h-9z"/>
      <rect x="619" y="272" width="2" height="12" rx="1"/>
    </g>
    <circle cx="630" cy="278" r="16" fill="#5b8cff"/>
    <rect x="625" y="271" width="4" height="14" rx="1.5" fill="#0a0a0f"/>
    <rect x="632" y="271" width="4" height="14" rx="1.5" fill="#0a0a0f"/>

    <!-- clock / widgets below -->
    <text x="512" y="380" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="300">09:41</text>
    <text x="514" y="400" fill="#ffffff" fill-opacity="0.62" font-family="Helvetica, Arial, sans-serif" font-size="10">Thu, Nov 12  ·  24° Clear</text>

    <rect x="512" y="420" width="118" height="74" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="526" y="438" fill="#ffffff" fill-opacity="0.6" font-family="Helvetica, Arial, sans-serif" font-size="8.5">Weather</text>
    <text x="526" y="466" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="500">24°</text>
    <text x="526" y="481" fill="#ffffff" fill-opacity="0.55" font-family="Helvetica, Arial, sans-serif" font-size="8">Clear · H 29° L 18°</text>

    <rect x="642" y="420" width="118" height="74" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="656" y="438" fill="#ffffff" fill-opacity="0.6" font-family="Helvetica, Arial, sans-serif" font-size="8.5">Steps</text>
    <text x="656" y="466" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="500">6,842</text>
    <text x="656" y="481" fill="#ffffff" fill-opacity="0.55" font-family="Helvetica, Arial, sans-serif" font-size="8">of 10,000 today</text>

    <!-- dock -->
    <rect x="512" y="578" width="238" height="66" rx="24" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.14"/>
    <g font-size="19" text-anchor="middle">
      <text x="544" y="618">📞</text>
      <text x="603" y="618">💬</text>
      <text x="662" y="618">🌐</text>
      <text x="721" y="618">📷</text>
    </g>
    <rect x="611" y="660" width="16" height="5" rx="2.5" fill="#5b8cff"/>
    <circle cx="635" cy="662.5" r="2.5" fill="#ffffff" fill-opacity="0.35"/>
    <circle cx="647" cy="662.5" r="2.5" fill="#ffffff" fill-opacity="0.35"/>
  </g>

  <text x="450" y="706" text-anchor="middle" fill="#6f7488" font-family="Helvetica, Arial, sans-serif" font-size="11">Tap the island to expand · Island Lab triggers music, timer, calls and charging</text>
</svg>
