<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1b2440"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f63b8"/>
      <stop offset="45%" stop-color="#131a30"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1c23"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="900" height="720" fill="url(#bg)"/>

  <text x="450" y="52" text-anchor="middle" fill="#f4f5fa" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600">OriginOS 7 · Origin Island</text>
  <text x="450" y="78" text-anchor="middle" fill="#8f94a8" font-family="Helvetica, Arial, sans-serif" font-size="13">Jetpack Compose demo · compact pill and expanded live activity</text>

  <!-- Phone 1: compact -->
  <g filter="url(#shadow)">
    <rect x="120" y="110" width="300" height="570" rx="46" fill="#0a0a0e" stroke="#2a2c38" stroke-width="2"/>
    <rect x="130" y="120" width="280" height="550" rx="38" fill="url(#wall)"/>
    <circle cx="190" cy="160" r="90" fill="#5b8cff" opacity="0.22" filter="url(#glow)"/>

    <!-- status bar -->
    <text x="160" y="150" fill="#dfe3f0" font-family="Helvetica, Arial, sans-serif" font-size="11">09:41</text>
    <rect x="352" y="141" width="18" height="9" rx="2.5" fill="none" stroke="#dfe3f0" stroke-opacity="0.8"/>
    <rect x="354" y="143" width="11" height="5" rx="1.5" fill="#dfe3f0"/>

    <!-- compact island -->
    <rect x="195" y="166" width="150" height="34" rx="17" fill="url(#island)" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="205" y="175" width="18" height="18" rx="6" fill="url(#art)"/>
    <text x="212" y="188" text-anchor="middle" fill="#fff" font-family="Helvetica, Arial, sans-serif" font-size="9">♫</text>
    <text x="231" y="187" fill="#eef1f8" font-family="Helvetica, Arial, sans-serif" font-size="9.5">Midnight City</text>
    <rect x="313" y="180" width="2.5" height="7" rx="1.2" fill="#5b8cff"/>
    <rect x="319" y="176" width="2.5" height="15" rx="1.2" fill="#5b8cff"/>
    <rect x="325" y="179" width="2.5" height="9" rx="1.2" fill="#5b8cff"/>
    <rect x="331" y="174" width="2.5" height="18" rx="1.2" fill="#5b8cff"/>

    <!-- clock -->
    <text x="152" y="270" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="300">09:41</text>
    <text x="154" y="292" fill="#ffffff" fill-opacity="0.62" font-family="Helvetica, Arial, sans-serif" font-size="11">Thu, Nov 12  ·  24° Clear</text>

    <!-- widgets -->
    <rect x="150" y="316" width="118" height="82" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="164" y="336" fill="#ffffff" fill-opacity="0.6" font-family="Helvetica, Arial, sans-serif" font-size="9">Weather</text>
    <text x="164" y="365" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="500">24°</text>
    <text x="164" y="382" fill="#ffffff" fill-opacity="0.55" font-family="Helvetica, Arial, sans-serif" font-size="8.5">Clear · H 29° L 18°</text>
    <text x="244" y="340" font-size="14">☀️</text>

    <rect x="282" y="316" width="118" height="82" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="296" y="336" fill="#ffffff" fill-opacity="0.6" font-family="Helvetica, Arial, sans-serif" font-size="9">Steps</text>
    <text x="296" y="365" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="500">6,842</text>
    <text x="296" y="382" fill="#ffffff" fill-opacity="0.55" font-family="Helvetica, Arial, sans-serif" font-size="8.5">of 10,000 today</text>
    <text x="378" y="340" font-size="14">🏃</text>

    <!-- app grid -->
    <g>
      <rect x="152" y="422" width="50" height="50" rx="16" fill="#2f3550" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="177" y="454" text-anchor="middle" font-size="20">📷</text>
      <rect x="224" y="422" width="50" height="50" rx="16" fill="#4a2f50" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="249" y="454" text-anchor="middle" font-size="20">🖼️</text>
      <rect x="296" y="422" width="50" height="50" rx="16" fill="#203a48" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="321" y="454" text-anchor="middle" font-size="20">🎵</text>
      <rect x="368" y="422" width="50" height="50" rx="16" fill="#2b3f63" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="393" y="454" text-anchor="middle" font-size="20">🌤️</text>

      <rect x="152" y="496" width="50" height="50" rx="16" fill="#35353f" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="177" y="528" text-anchor="middle" font-size="20">⚙️</text>
      <rect x="224" y="496" width="50" height="50" rx="16" fill="#1f3a3a" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="249" y="528" text-anchor="middle" font-size="20">🕐</text>
      <rect x="296" y="496" width="50" height="50" rx="16" fill="#4a4022" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="321" y="528" text-anchor="middle" font-size="20">📝</text>
      <rect x="368" y="496" width="50" height="50" rx="16" fill="#3b2b4a" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="393" y="528" text-anchor="middle" font-size="20">🛍️</text>
    </g>

    <!-- dock -->
    <rect x="148" y="578" width="244" height="66" rx="24" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.14"/>
    <g font-size="19" text-anchor="middle">
      <text x="181" y="618">📞</text>
      <text x="242" y="618">💬</text>
      <text x="303" y="618">🌐</text>
      <text x="364" y="618">📷</text>
    </g>

    <!-- page dots -->
    <rect x="248" y="660" width="16" height="5" rx="2.5" fill="#5b8cff"/>
    <circle cx="272" cy="662.5" r="2.5" fill="#ffffff" fill-opacity="0.35"/>
    <circle cx="284" cy="662.5" r="2.5" fill="#ffffff" fill-opacity="0.35"/>
